[build]
  command = "npm run build"
  publish = "dist"

# Astro 7 needs Node 22.12 or newer. Pinned so a change in Netlify's default
# image can never break a deploy.
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Security headers. Applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    # Every script on this site is an external file under /js/, so script-src
    # needs no 'unsafe-inline' and no per-script hashes. Astro's scoped styles
    # are emitted inline, which is why style-src alone carries 'unsafe-inline'
    # — inline CSS cannot execute, so the risk is not comparable.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
